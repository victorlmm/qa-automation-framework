name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1-5"   # weekdays 09:00 UTC, catches site changes early
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Unit tests (framework code)
        run: pytest -m unit

      - name: API, UI and integration tests
        id: tests
        continue-on-error: true
        run: >
          pytest -m "not unit"
          -n auto --reruns 1 --reruns-delay 2
          --browser chromium
          --alluredir=allure-results

      - name: AI failure triage (Claude)
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m ai_triage

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            allure-results/
          retention-days: 14

      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
